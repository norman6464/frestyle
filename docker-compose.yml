name: frestyle-local

services:
  db:
    image: public.ecr.aws/docker/library/postgres:17.6-alpine
    container_name: frestyle-local-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LOCAL_DB_USER:-frestyle}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-frestyle}
      POSTGRES_DB: ${LOCAL_DB_NAME:-frestyle}
      # en_US.UTF-8 は本番（Supabase）と揃える。--locale=C だと pg_trgm の日本語トライグラムが
      # 黙って空になり（show_trgm('認証コード') が {}）、あいまい検索がローカルでだけ全滅する
      # （実測済み）。ロケールは initdb 時にしか効かないため、
      # 既存の db_data ボリュームがある環境は `docker compose down -v`（= make local-reset）で
      # 作り直すこと。
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=en_US.UTF-8'
    ports:
      # ループバックにだけ配る。既定の資格情報(frestyle/frestyle)を持つ DB なので、
      # 0.0.0.0 に開くと同じ LAN に居る誰でも接続できてしまう(公衆 Wi-Fi・社内ネットワーク)。
      # コンテナ間はこの ports に関係なく compose のネットワーク越しにサービス名 `db` で届く。
      - '127.0.0.1:${LOCAL_DB_PORT:-5432}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/scripts/local-db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${LOCAL_DB_USER:-frestyle} -d ${LOCAL_DB_NAME:-frestyle}']
      interval: 2s
      timeout: 3s
      retries: 30

  # ローカル開発用の OSS OIDC 発行者(Dex)。Go 製単一バイナリで DB 不要・数秒で起動する。
  # storage: type: memory のため `docker compose down` でユーザー / セッションは消えるが、
  # ユーザーは docker/idp/config.yaml の staticPasswords で毎回同じものが復元される。
  idp:
    image: ghcr.io/dexidp/dex:v2.45.1
    container_name: frestyle-local-idp
    restart: unless-stopped
    command: dex serve /etc/dex/config.yaml
    volumes:
      - ./docker/idp/config.yaml:/etc/dex/config.yaml:ro
    ports:
      # ポート番号(5556)は固定すること。可変にすると
      # (1) 上でマウントする config.yaml の issuer 文字列、
      # (2) frontend/.env.example の VITE_OIDC_AUTHORIZE_URI、
      # (3) backend サービスの OIDC_JWKS_URI の既定値
      # の 3 箇所が同時にずれ、気づかないまま全員 401 になる。変えるなら 3 箇所を揃えて変えること。
      - '127.0.0.1:5556:5556'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: frestyle-local-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${LOCAL_DB_USER:-frestyle}:${LOCAL_DB_PASSWORD:-frestyle}@db:5432/${LOCAL_DB_NAME:-frestyle}?sslmode=disable
      APP_ENV: ${APP_ENV:-local}
      # ===== 認証(Bearer の ID トークン検証) =====
      # 発行者はローカルの Dex(上の idp サービス)。config.Load() は 3 つとも揃わないと
      # 起動しない(fail-closed)ため、compose 側で既定値を必ず与える。.env で上書きすれば
      # 別の発行者(本番の GCIP 等)にも向けられる。
      #
      # OIDC_ISSUER はブラウザ(トークンの iss と比較する側)から見た URL なので localhost。
      # OIDC_JWKS_URI は backend コンテナが直接叩く宛先なので、Docker ネットワーク内の
      # サービス名 `idp` で到達させる(localhost だと backend 自身を指してしまう)。
      # OIDC_AUDIENCES は Dex の client_id（aud クレームに入る値）。backend は client_id という
      # 概念自体を持たず、aud として受け入れる値の一覧としてだけ扱う。
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:5556/dex}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-http://idp:5556/dex/keys}
      OIDC_AUDIENCES: ${OIDC_AUDIENCES:-frestyle-local}
    ports:
      # db と同じくループバックにだけ配る。frontend の dev server もホスト上で動くので
      # これで足りる。LAN 内の実機から叩きたいときだけ docker-compose.override.yml
      # (git 管理外) でこの行を上書きする。
      - '127.0.0.1:${LOCAL_BACKEND_PORT:-8080}:8080'
    depends_on:
      db:
        condition: service_healthy
      idp:
        condition: service_started
    # distroless にはシェルも curl も無いためコンテナ内の healthcheck は書けない。
    # 起動確認は `curl http://localhost:8080/api/v2/health` で行う。

volumes:
  db_data:
    name: frestyle-local-db-data
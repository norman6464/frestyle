# sqlc 設定（生 SQL 直書き → 型安全な Go を生成）。
#
# 方針（データアクセスの生 SQL 化）:
#   - 生成コードは database/sql モード。アプリ全体で 1 つの *sql.DB を DBTX として渡し、
#     接続プールを共有する（別 pool を持たない）。
#   - 下の schema 欄のファイルは Atlas の宣言的スキーマ（internal/infra/database/schema/schema.hcl）
#     から機械生成した DDL。正本は schema.hcl で、schema.gen.sql はそこから
#     `make schema-gen` が作る DO NOT EDIT な副産物（CI が drift を検査する）。
#     起動時に infra/database の ApplySchema が go:embed した本文をそのまま流し、
#     sqlc も同じファイルから型を起こすので、宣言と実体がずれない。
#
#       schema/schema.gen.sql  … 全テーブル（中核 + ナレッジの骨格 + ナレッジの権限 + 教材の権限）
#
#     Atlas は宣言のみ（履歴ファイルを持たない）。既存 DB（本番）への適用は
#     `make schema-apply` が schema.hcl を正本にした Atlas の宣言的 apply で行う。
#     schema.gen.sql は CREATE 文だけで DO ブロック・IF NOT EXISTS を持たないため、
#     「まだ何も無い空の DB」（結合テスト・ローカルの初回起動）にしか使わない。
#
# 生成: backend/ で `make sqlc`
# 検査: backend/ で `make sqlc-vet`（このファイル末尾の rules を全クエリに当てる。CI でも走る）
#
# ---------------------------------------------------------------------------
# この設定を触る人へ: 「ローカルと CI では通るが本番でだけ落ちる」項目がある
#
# 接続経路が環境で違い、しかも *プロトコルが違う*。
#
#   ローカル直結 / CI     … PostgreSQL へ直結。extended protocol。
#                           パラメータは型 OID を付けて本文と別に送られ、
#                           prepared statement はその接続が生きているあいだ残り続ける。
#
#   本番                  … Supabase の transaction pooler（pgbouncer）越し。
#                           infra/database/postgres.go が DSN を見て simple query protocol を
#                           強制する。パラメータはクライアント側で SQL リテラルへ埋め込まれ、
#                           pooler は文と文のあいだで裏の PostgreSQL 接続を別クライアントへ
#                           回すため、prepared statement はセッションをまたいで残らない。
#
# つまり「prepared statement を作って後で使い回す」（emit_prepared_queries）も
# 「Go の型がそのまま SQL の構文になる」（下の jsonb override）も、直結では顕在化しない。
# テストが全部緑でも本番でだけ落ちる、という壊れ方をする。設定を変えるときは
# 直結で動いたことを根拠にしないこと。
# ---------------------------------------------------------------------------
version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "internal/infra/database/schema/schema.gen.sql"
    queries: "internal/adapter/persistence/queries"

    # このブロックのクエリすべてに当てる vet ルール。実体はファイル末尾の rules: に定義する。
    # ここに名前を並べない限りルールは 1 本も走らない（rules: を書いただけでは無反応）。
    rules:
      - mutation-requires-where
      - narrowing-cast-on-param
      - no-array-param

    gen:
      go:
        package: "sqlcgen"
        out: "internal/adapter/persistence/sqlcgen"
        sql_package: "database/sql"
        # sql_package を "pgx/v5" にはしない（検討したうえで見送った）。
        # 同じ検討を誰かが一から繰り返さないよう、判断と再検討の条件をここに残す。
        #
        # pgx/v5 ネイティブにしたときの利点:
        #   - NULL 可の列を sql.NullXxx ではなく pgtype で扱える。いまの生成物には
        #     sql.NullBool / NullInt64 / NullString / NullTime が合計 89 箇所あり
        #     （実測: NullInt64 30 / NullString 29 / NullTime 19 / NullBool 11）、
        #     repository はそのたびに .Valid を見て domain 型へ詰め替えている。
        #   - 配列・jsonb を pgtype がそのまま持てる。下の jsonb override のような
        #     「simple protocol での埋め込み構文を合わせるために Go の型を手で指定する」
        #     回避が、型の側で素直に解ける見込みがある。
        #
        # 見送った理由:
        #   - 生成される型が総入れ替えになり、adapter/persistence の全 repository が
        #     同時に壊れる。ORM（GORM）を全廃した直後に、データアクセス層をもう一度
        #     全面的に書き換えるリスクは取らない。
        #   - simple protocol（本番の pooler 経路）での jsonb・配列の埋め込み挙動を
        #     全件検証し直す必要がある。ここはファイル冒頭に書いたとおり
        #     「ローカルと CI では緑のまま本番でだけ落ちる」領域で、机上のレビューでは
        #     担保できない。検証コストが移行本体より大きい。
        #
        # 再検討の条件（どれかを満たしたら、調べ直さずここから始める）:
        #   - sql.NullXxx の詰め替えが原因の欠陥を実際に踏んだとき
        #   - pgtype でしか素直に表現できない型（配列・range・複合型など）が必要になったとき
        #   - 本番の接続経路が transaction pooler ではなくなり、simple protocol での
        #     検証が不要になったとき
        #   - 移行を repository 単位で刻める見通しが立ったとき
        #     （一括でしか切り替えられないうちは着手しない）

        # emit_prepared_queries は「意図的に書かない」（＝既定の false のまま）。
        #
        # true にすると sqlc は Prepare(ctx, db) を生成し、起動時に全クエリを
        # db.PrepareContext して *sql.Stmt を Queries に抱え込み、以後はその Stmt を
        # 使い回すコードを出す（実測: このリポジトリのクエリ数だけ、162 箇所の
        # PrepareContext 呼び出しが db.go に並ぶ）。ローカルの直結 PostgreSQL では
        # 往復が減って正しく速い。だが本番は transaction pooler（pgbouncer）越しで、
        # pooler は文と文のあいだで裏の接続を別クライアントへ回す。準備したときの接続と
        # 実行するときの接続が同じである保証がないので、実行時に
        # "prepared statement does not exist"（SQLSTATE 26000）で落ちる。
        # infra/database/postgres.go が pooler の DSN を見て simple query protocol を
        # 強制しているのも同じ理由。
        #
        # 質が悪いのは、この壊れ方がローカルでも CI でも再現しないこと。どちらも直結で、
        # 接続が生きているあいだ prepared statement は残るので全テストが緑のまま通る。
        # 壊れるのはデプロイして pooler 越しに叩いた瞬間だけになる。
        #
        # 歯止めは設定の文字列ではなく「生成結果」を見る:
        #   internal/adapter/persistence/sqlcgen_prepared_statements_test.go が
        #   sqlcgen/*.go を構文解析し、PrepareContext の *呼び出し* が 0 件であることを
        #   確かめる。設定の書き方（キー名の変更・別ファイルへの分割）が変わっても、
        #   結果を見ているので効き続ける。
        #
        # 宣言と呼び出しを取り違えないこと:
        #   DBTX interface の PrepareContext(...) は emit_prepared_queries の値に関係なく
        #   sqlc が必ず「宣言」する。宣言を違反として数えると検査は永久に落ち、
        #   呼び出しではなく宣言の有無を見ると永久に通る。上のテストは宣言を違反にせず、
        #   同時に「宣言が確かにあること」も確認して、正しい生成物を見ていることを担保する。

        # :many のクエリが 0 件のとき nil ではなく空スライス（[]T{}）を返させる。
        #
        # nil スライスは encoding/json で null になり、handler がそのまま返すと
        # フロントの .map / .filter / for-of が TypeError で落ちる。データがまだ無い
        # 新規ユーザー・新規コース・未提出の演習など「使い始めの動線」を直撃する。
        #
        # これは sqlc 生成物側の保証であり、手書きの repository が独自に nil を
        # 返す書き方（早期 return 等）まではここでは検査しない。手書き側で nil を
        # 返さないことはレビューで担保する。
        emit_empty_slices: true
        emit_json_tags: false
        emit_interface: false
        overrides:
          # NULL 可の jsonb（blocks.inline）は *json.RawMessage にする。受信・送信の両方を
          # 満たせる型がこれしかないため、ポインタは飾りではなく必須。
          #
          #   - 受信: json.RawMessage は NULL を Scan できない（database/sql が
          #     "unsupported Scan, storing driver.Value type <nil>" で落ちる）。ポインタなら nil で受かる。
          #   - 送信: 本番は transaction pooler 経由なので simple protocol になる
          #     （infra/database/postgres.go が DefaultQueryExecMode を simple protocol に
          #     切り替える）。simple protocol では pgx がパラメータを
          #     クライアント側で SQL リテラルへ埋め込むので、Go の型がそのまま構文を決める。
          #     []byte は bytea の 16 進リテラル（'\x...'）になり jsonb 列で 22P02
          #     （invalid input syntax for type json）になる。json.RawMessage なら json として埋まる。
          #
          # extended protocol（ローカル直結 / CI）はパラメータの OID で jsonb と判るため []byte でも
          # 通ってしまう。つまりこの取り違えはローカルと CI では緑のままで、本番でだけ落ちる。
          # sqlc 既定の pqtype.NullRawMessage も Value() が []byte を返すので simple protocol では同じく
          # 22P02 になり、既定に戻すのは解にならない。
          # NOT NULL の jsonb（attrs / doc）は NULL が来ないので既定の json.RawMessage のままで良い。
          - db_type: "jsonb"
            nullable: true
            go_type:
              import: "encoding/json"
              type: "RawMessage"
              pointer: true

          # date は time.Time ではなく 'YYYY-MM-DD' の文字列で運ぶ。
          #
          # 既定では sqlc が date 列を time.Time にする。ローカルと CI（extended protocol）は
          # パラメータに型 OID が付くので date として送られ、何も起きない。
          # 本番は transaction pooler 越しの simple protocol で、pgx がパラメータを
          # クライアント側で SQL リテラルへ埋め込む（このファイル冒頭の「プロトコルが違う」）。
          # time.Time は timestamptz のリテラルとして埋まり、date 列へ入れる際に
          # セッションの TimeZone（UTC）で切り捨てられる。日本時間 0 時ちょうどの日付は
          # UTC では前日 15 時なので、**保存した日付が 1 日前になる**。
          #
          # 期限・開始日は「その日」であって時刻を持たない。time.Time で運ぶと、
          # 呼び出し側がどの時刻・どのロケーションを詰めるかで結果が変わる余地が残る。
          # 文字列にすれば、Go から DB まで同じ 10 文字がそのまま運ばれ、
          # ずれる場所が無くなる（比較・大小は 'YYYY-MM-DD' の辞書順が日付順と一致する）。
          #
          # NULL 可の側は sql.NullString ではなく internal/adapter/persistence/pgtext.NullDate
          # を使う。理由（実機確認済み）: pgx の stdlib（database/sql）互換層は
          # date 型（OID 1082）を宛先の Go 型に関わらず内部で time.Time にデコードしてから
          # driver.Value として渡す（stdlib/sql.go の Rows.Next がこの OID をハードコードで
          # pgtype.Date に読み、.Value() で time.Time化する。TypeMap.RegisterType で OID の
          # Codec を差し替えても、この switch 文の変数自体が pgtype.Date に固定されているので
          # 効かない。simple / extended のどちらの query protocol でも同じ。pgx v5.9.2 で
          # 実機確認済み）。宛先を sql.NullString にしても、その Scan は database/sql の
          # convertAssign を経由し、time.Time → *string の変換に time.RFC3339Nano を使うため
          # （'2026-09-01' ではなく '2026-09-01T00:00:00Z' になる）、型を変えるだけでは直らない。
          # pgtext.NullDate は time.Time でも string でも受けて 'YYYY-MM-DD' に正規化する。
          #
          # SQL 側で ::text にキャストして正体を変える対処は採らなかった —
          # SELECT * / RETURNING * を全クエリぶん明示列挙し直す必要があるうえ、
          # sqlc がキャスト式の NULL 許容を追えず NOT NULL の string になってしまい
          # （すべての値が値ありの前提で string になる。実機確認済み）、NULL の start_date /
          # due_date を持つ行の scan がそのまま失敗する。ドライバの型変換を信用しない
          # Scanner をここに置く方が、クエリを増やさずに 1 箇所で閉じる。
          #
          # この設定は date 列が 1 つも無い時点で先回りして入れた。
          # 生成物は変わらないが、date 列を足した瞬間から効く。**列を足してから
          # 気づく類の欠陥ではない**（ローカルと CI では最後まで再現しないため、
          # 本番で日付が 1 日ずれて初めて分かる）ので、列より先に置いている。
          - db_type: "date"
            go_type: "string"
          - db_type: "date"
            nullable: true
            go_type:
              import: "github.com/norman6464/frestyle/backend/internal/adapter/persistence/pgtext"
              type: "NullDate"

# ---------------------------------------------------------------------------
# sqlc vet の静的ルール（backend/ で `make sqlc-vet`。CI の backend ジョブでも走る）
#
# `sqlc generate` はスキーマとクエリを突き合わせて Go を出すが、「SQL として書けてしまう
# 危険」までは見ない。vet は生成とは別に、クエリ 1 本ずつへ下のルールを当てて落とす。
# ORM をやめて生 SQL に統一したので、ORM が暗黙に付けてくれていた安全弁はもう無い。
# ここが最後の機械的な網になる。
#
# vet の CEL 式から見えるもの（sqlc v1.31.1 で実際に確かめた）:
#   query.sql    … SQL 本文。ただし「書いたとおりの文字列」ではなく、sqlc が処理したあとの
#                  SQL であることに注意する（sqlc v1.31.1 で実測）:
#                    - `-- name:` 行と、そのあと最初の SQL キーワードまでの説明コメントは
#                      落ちている。文の途中に置いたコメント行は残る
#                      （実測: 162 本中 3 本。knowledge_base_permission.sql の大きな CTE 群）。
#                      下のルールがコメント行を落としてから見ているのは、この「文中コメント」で
#                      誤判定しないため。
#                    - sqlc.arg(x) / sqlc.narg(x) / sqlc.slice(x) は既に $1, $2 … へ
#                      書き換わっている。つまり CEL からは `sqlc.` で始まる文字列は一切見えず、
#                      `sqlc.slice を使うな` のようなルールはここには書けない。
#   query.name   … クエリ名（GetUserByID 等）
#   query.cmd    … one / many / exec / execrows のいずれか（`:` は付かない）
#   query.params … $1..$n の「番号」だけ。列名も型も入っていない
#   config       … このファイルの version / engine / schema / queries
#   postgresql.explain … 実 DB への接続設定があるときだけ。今は設定していないので使えない
#   文字列関数（split / filter / trim / startsWith / join / matches …）は使える。
#   matches は RE2 で、部分一致（アンカーは自分で書く）。(?i) / (?m) のインラインフラグは効く。
#
# 表現できないこと（できないと分かったうえで諦めている）:
#   スキーマが CEL から一切見えない。列の型も、その表にどんな列があるのかも分からない。
#   ここで書けるのは実質「処理後の SQL 本文への正規表現」までになる。
#
#   このため、下の narrowing-cast-on-param は「bigint の列に ::int を掛けている」という
#   照合はしていない。列の型を見ずに済むよう、そもそも「パラメータを 32bit へ絞ること自体」を
#   禁じる形にしてある（理由はルール本体のコメント）。
#
#   スキーマも、クエリに添えたコメントも要る検査は、ここには書けない。実例が 2 つあり
#   どちらも Go のテストに置いた（internal/adapter/persistence/queries_static_check_test.go）:
#     - upsert-owner-scope … ON CONFLICT の衝突キーと「その表の所有者列」を突き合わせる。
#                            表の列が分からないと判定できない
#     - no-sqlc-slice      … sqlc.slice の使用禁止。上のとおり CEL には $N しか届かない
#   型の食い違いそのものは `sqlc generate`（スキーマとの突き合わせ）と、本物の PostgreSQL に
#   対する結合テスト（*_integration_test.go）で拾う。
#
# 組み込みルール sqlc/db-prepare は入れていない:
#   実 DB へ繋いで全クエリを PREPARE してみるルールで、生きた PostgreSQL への接続設定が要る。
#   一方このリポジトリでは、列名・型の食い違いは `sqlc generate` がスキーマと突き合わせて
#   先に落とすし、repository は本物の PostgreSQL に対する結合ジョブで実際に実行している。
#   db-prepare が追加で拾えるのは「generate は通るが PREPARE では落ちる」狭い差分だけで、
#   その代わりに CI の静的検査ジョブへ DB 依存を 1 つ増やすことになる。割に合わないと判断した。
#
# 個別に外したいとき: そのクエリのコメントに /* @sqlc-vet-disable <ルール名> */ を書く
# （ルール名を省くとそのクエリの vet が丸ごと止まる）。外すなら必ず理由も併記すること。
# ---------------------------------------------------------------------------
rules:
  # UPDATE / DELETE に WHERE が無いクエリを弾く。
  #
  # WHERE の無い UPDATE / DELETE は構文として正しく、`sqlc generate` も素通りし、
  # 実行するとテーブルの全行を書き換える / 消す。取り返しのつかない側の事故なので、
  # 実行時ではなく書いた時点で落とす。
  #
  # 判定の作り（正規表現しか書けないという制約の中でどうやっているか）:
  #   1. SQL 本文を行に割り、行頭が `--` のコメント行を落とす。理由は 2 つ。
  #      (a) ファイル先頭の見出しコメントが最初のクエリの本文に付いてくるので、
  #          落とさないと「文の先頭が UPDATE か」を見誤る。
  #      (b) 説明文に「WHERE」と書いてあるだけで WHERE 有りと誤判定するのを防ぐ。
  #   2. 残った行に「行頭（前後の空白を除く）が UPDATE / DELETE の行」があれば更新系とみなす。
  #      (?m) を付けているので CTE の中（WITH x AS ( UPDATE ... )）も拾う。
  #      `\b` があるので updated_at / deleted_at では誤爆しない。
  #      INSERT ... ON CONFLICT DO UPDATE は UPDATE が行頭に来ないので拾わない。
  #   3. その本文に WHERE が 1 つも無ければ違反。
  #
  # 既知の限界（誤検知より見逃し側に倒してある）:
  #   sqlc の 1 クエリ = 1 文なので「本文のどこかに WHERE があるか」で概ね足りるが、
  #   副問い合わせ側にだけ WHERE がある UPDATE（本体は全行更新）は見逃す。
  #   行末に付けた `--` コメントの中の WHERE も数えてしまう。
  #   厳密にするには SQL の構文解析が要り、CEL では書けない。
  #   導入時点（クエリ 162 本 / うち UPDATE・DELETE 43 本）で誤検知 0・違反 0 を実測している。
  - name: mutation-requires-where
    message: >-
      UPDATE / DELETE に WHERE がありません。実行するとテーブルの全行が対象になります。
      絞り込み条件を書いてください。全件が本当に意図なら、そのクエリのコメントに
      /* @sqlc-vet-disable mutation-requires-where */ と理由を書いて明示的に外してください。
    rule: >-
      query.sql.split("\n").filter(line, !line.trim().startsWith("--")).join("\n").matches("(?im)^[ \\t]*(update|delete)\\b")
      &&
      !query.sql.split("\n").filter(line, !line.trim().startsWith("--")).join("\n").matches("(?i)\\bwhere\\b")

  # パラメータを int / integer / smallint へキャストするのを弾く。
  #
  # 何が起きたか（このルールの出どころ）:
  #   bigint 列へ渡すパラメータに `sqlc.arg(x)::int` と書いていた箇所が 6 つあった
  #   （course_chapters の revision / schema_version / sort_order、rich_documents の
  #   schema_version / revision、courses の sort_order）。
  #   キャストは「SQL 側でこの式を int4 として扱う」という宣言なので、sqlc はそれを信じて
  #   パラメータを int32 で生成する。repository は int64 の値を int32() で詰め替えることに
  #   なり、Go の整数変換は上位ビットを黙って捨てる。実測で 2147483648 を渡すと
  #   -2147483648 が保存された（int32(2147483648) == -2147483648）。
  #
  # なぜテストでもローカルでも気づけないか:
  #   どこにもエラーが出ない。SQL としては正しく、`sqlc generate` も通る（型を決めているのは
  #   まさにこのキャストなので、生成側から見れば食い違いは無い）。PostgreSQL も気づけない。
  #   Go の側で既に値が折り返してから送られるので、DB には「小さな負の数」が正常値として届く。
  #   さらにテストもローカルも id やリビジョンが 2^31 に届かないので、条件そのものが起きない。
  #   壊れるのは値が 21 億を超えたときだけで、そのときも例外ではなくデータの化けとして現れる。
  #
  # なぜ「列の型と照らす」のではなく「絞ること自体」を禁じるのか:
  #   CEL からはスキーマが見えないので「この列は bigint なのに ::int だ」という照合はできない
  #   （ファイル冒頭の「表現できないこと」）。だが列の型を知らなくても、パラメータ側を広く
  #   取るのは常に安全側になる。宣言が integer の列でも、パラメータが bigint なら Go は
  #   int64 のまま値を運び、範囲外なら PostgreSQL が "integer out of range" で弾く
  #   ＝ 事故が例外として表に出る。::int にすると同じ値が Go の中で静かに折り返し、DB は
  #   何も知らないまま受け取る。「宣言と実型がずれていた」実例もあり（courses.sort_order は
  #   schema 上 integer、実型は bigint だった）、パラメータ側を広く取れば食い違っても壊れない。
  #
  # 何を見ているか / 何を弾かないか:
  #   vet に届く時点で sqlc.arg(x) は $1 へ書き換わっている（ファイル冒頭に実測を記載）。
  #   そこで「プレースホルダ $N の直後のキャスト」だけを見る。ソースに sqlc.arg(x)::int と
  #   書いてあれば $1::int として一致する。
  #   式の結果に対するキャストは直前が `)` などになるので一致しない
  #   （`COALESCE(..., 0)::integer AS grant_rank` など・knowledge_base_permission.sql に 3 箇所）。
  #   ::int8 / ::bigint は「int」で始まるが単語境界が合わないので一致しない。::interval も同様。
  #
  # 既知の限界:
  #   `CAST($1 AS int)` という書き方は見ていない。このリポジトリのクエリはキャストをすべて
  #   `::` で書いており（CAST( の使用は実測 0 件）、正規表現を倍に伸ばして読みにくくする割に
  #   拾えるものが無いため。CAST( を使い始めるならここも直すこと。
  #
  # 免除してよい場合:
  #   そのパラメータが本当に 32bit であるべきとき（int4 を要求する関数へ直接渡す等）。
  #   そのクエリのコメントに /* @sqlc-vet-disable narrowing-cast-on-param */ と理由を書く。
  #   「今の値は小さいから大丈夫」は理由にならない（大きくなった日に静かに壊れるのが問題なので）。
  - name: narrowing-cast-on-param
    message: >-
      パラメータを int / integer / smallint へキャストしています。sqlc がこのパラメータを
      int32 で生成するため、2^31 以上の値は Go 側で黙って負数へ折り返します
      （実測: 2147483648 → -2147483648）。エラーは出ず、化けた値がそのまま保存されます。
      ::bigint にしてください（列の宣言が integer でも、範囲外なら PostgreSQL が
      "integer out of range" で弾いてくれるぶん安全です）。本当に 32bit が必要なら
      /* @sqlc-vet-disable narrowing-cast-on-param */ と理由をクエリのコメントに書いてください。
    rule: >-
      query.sql.split("\n").filter(line, !line.trim().startsWith("--")).join("\n").matches("(?i)[$][0-9]+[ \\t]*::[ \\t]*(int|integer|int4|smallint|int2)\\b")

  # パラメータを配列型にキャストするのを弾く（IN 句をまとめて渡したいとき用）。
  #
  # 何が起きるか:
  #   `= ANY($1::bigint[])` や `<> ALL($1::text[])` のように配列型のパラメータを作ると、
  #   database/sql モードの sqlc は引数を pq.Array() で包むコードを生成し、生成物に
  #   github.com/lib/pq の import を足す（実測で確認）。このリポジトリの driver は pgx で、
  #   lib/pq は go.mod に入っていない。
  #
  # なぜ止めるのか（ビルドが壊れるだけなら放っておけばいい、ではない理由）:
  #   壊れ方が「直し方を間違えやすい」形で出る。`make sqlc` の直後に出るのは
  #   「github.com/lib/pq を提供するモジュールがありません」というビルドエラーで、
  #   素直に読むと `go get github.com/lib/pq` が正解に見える。そうすると、避けている
  #   はずの driver がもう 1 つ依存に入り、以後この生成が「通ってしまう」ようになる。
  #   書いた時点で理由ごと止めれば、その分岐に入らない。
  #
  # 代わりにどう書くか:
  #   id の集まりは json 配列 1 個のパラメータで渡し、SQL 側で展開する。
  #   実例は comment.sql の ListCommentsByThreadIDs
  #   （json_array_elements_text で展開してから uuid へ落としている）。
  #
  # 何を弾かないか:
  #   見るのは「プレースホルダ $N の直後の配列キャスト」だけ。
  #   `= ANY(SELECT ...)` の副問い合わせ形は配列パラメータを作らない（実測: 生成物に
  #   pq.Array は出ず、素の $1 のまま）ので対象外。式の結果に対する配列キャストも同様。
  #
  # 免除してよい場合:
  #   lib/pq を依存に入れる判断そのものを別途したうえで使うとき。
  #   /* @sqlc-vet-disable no-array-param */ に理由を書くこと。
  - name: no-array-param
    message: >-
      パラメータを配列型にキャストしています。database/sql モードの sqlc はこれを
      pq.Array() で包む生成にし、github.com/lib/pq を import します。このリポジトリの
      driver は pgx で lib/pq は go.mod に入っていないため、生成物がビルドできなくなります
      （そして「lib/pq を足す」という誤った直し方に誘導されます）。
      id の集まりは json 配列 1 個のパラメータで渡し、json_array_elements_text で
      展開してください（実例: comment.sql の ListCommentsByThreadIDs）。
    rule: >-
      query.sql.split("\n").filter(line, !line.trim().startsWith("--")).join("\n").matches("(?i)[$][0-9]+[ \\t]*::[ \\t]*[a-z_][a-z0-9_]*[ \\t]*\\[[ \\t]*\\]")


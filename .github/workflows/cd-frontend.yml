name: CD - Frontend Deploy to Firebase Hosting

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '本番デプロイ確認用に "deploy" と入力してください'
        required: true
        type: string
      auth_mode:
        description: 'ログインを止めたまま出すなら unconfigured。既定は configured（設定が欠けていたら止まる）'
        required: false
        default: configured
        type: choice
        options: [configured, unconfigured]
  push:
    tags:
      - 'release/v*'

env:
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/691431142080/locations/global/workloadIdentityPools/github/providers/github-actions
  GCP_SERVICE_ACCOUNT: frestyle-frontend-deploy@frestyle-507912.iam.gserviceaccount.com
  FIREBASE_PROJECT_ID: frestyle-507912

permissions:
  contents: read

concurrency:
  group: cd-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Confirm input (workflow_dispatch only)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Verify confirmation input
        run: |
          if [ "${{ inputs.confirm }}" != "deploy" ]; then
            echo "ERROR: confirm に 'deploy' と入力されていません。中止します。"
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [guard]
    if: always() && (github.event_name == 'push' || needs.guard.result == 'success')
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./frontend

    env:
      VITE_API_BASE_URL: https://api.frestyle.dev

      VITE_FIREBASE_API_KEY: ${{ inputs.auth_mode != 'unconfigured' && 'AIzaSyBccI4D5QmiY3M1il3Kq80yhSNCXVasJVw' || '' }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ inputs.auth_mode != 'unconfigured' && 'frestyle-507912.firebaseapp.com' || '' }}
      VITE_FIREBASE_PROJECT_ID: ${{ inputs.auth_mode != 'unconfigured' && 'frestyle-507912' || '' }}

    steps:
      - uses: actions/checkout@v6

      - name: 認可の設定と宣言が噛み合っているか確かめる
        env:
          AUTH_MODE: ${{ inputs.auth_mode || 'configured' }}
        run: "${{ github.workspace }}/.github/scripts/check-auth-config.sh"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Verify SPA fallback shell
        run: test -f dist/app.html

      - name: Upload built assets
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: |
            frontend/dist
            firebase.json
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    environment: production
    permissions:
      id-token: write

    steps:
      - name: Download built assets
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: .

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting
        run: npx --yes --ignore-scripts firebase-tools@15.30.0 deploy --only hosting --project "${{ env.FIREBASE_PROJECT_ID }}" --non-interactive

      - name: 配信された実物を確かめる
        env:
          AUTH_MODE: ${{ inputs.auth_mode || 'configured' }}
        run: |
          url="https://frestyle-dev.web.app/"
          code=$(curl -sS -o /tmp/index.html -w '%{http_code}' --max-time 30 "$url")
          if [ "$code" != "200" ]; then
            echo "::error::${url} が ${code} を返しました"
            exit 1
          fi

          if ! grep -q 'id="root"' /tmp/index.html; then
            echo "::error::配信された HTML に描画先が見つかりません"
            exit 1
          fi

          missing_assets=""
          for asset in $(grep -o 'assets/[A-Za-z0-9._-]*\.js' frontend/dist/index.html | sort -u); do
            grep -q "${asset}" /tmp/index.html || missing_assets="${missing_assets} ${asset}"
          done
          if [ -n "${missing_assets}" ]; then
            echo "::error::配信された HTML が今回の資産を指していません（欠け:${missing_assets}）。エッジに古い版が残っています"
            exit 1
          fi

          entry=$(grep -o 'assets/[A-Za-z0-9._-]*\.js' /tmp/index.html | head -1)
          entry_code=$(curl -sS -o /tmp/entry.js -w '%{http_code}' --max-time 30 "https://frestyle-dev.web.app/${entry}")
          if [ "${entry_code}" != "200" ]; then
            echo "::error::${entry} が ${entry_code} を返しました"
            exit 1
          fi

          echo "配信を確認しました（${url} → ${code} / ${entry} → ${entry_code}）"
          {
            echo "### 配信の確認"
            echo "- \`${url}\` → ${code}"
            echo "- 今回の資産をすべて指している"
            echo "- \`${entry}\` → ${entry_code}"
            echo "- ログイン: $([ "${AUTH_MODE}" = "unconfigured" ] && echo "停止" || echo "有効")"
          } >> "$GITHUB_STEP_SUMMARY"

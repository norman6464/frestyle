name: Security Scan (Trivy)

on:
  pull_request:
    paths:
      - 'backend/go.mod'
      - 'backend/go.sum'
      - 'backend/**/Dockerfile*'
      - 'backend/**/*.yml'
      - 'backend/**/*.yaml'
      - 'backend/**/*.tf'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - 'frontend/pnpm-workspace.yaml'
      - '.trivyignore'
      - '.github/workflows/security.yml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  trivy:
    name: trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install Trivy
        env:
          TRIVY_VERSION: '0.71.0'
        run: |
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o /tmp/trivy.tar.gz
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo mv /tmp/trivy /usr/local/bin/trivy
          trivy --version

      - name: Trivy scan (backend)
        run: trivy fs --scanners vuln,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress backend

      - name: Trivy scan (frontend)
        run: trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress frontend

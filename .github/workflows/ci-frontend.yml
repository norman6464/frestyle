name: CI - Frontend (Vite + Vitest)

# 目的: frontend/ の typecheck / lint / build、Vitest（unit・storybook）とカバレッジ閾値、
# knip / size-limit（非ブロッキング）を行う。デプロイは cd-frontend.yml。
# frontend/**・CD の門番スクリプト・このファイル自身の変更でだけ発火する。
on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/scripts/**'
      - '.github/workflows/ci-frontend.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/scripts/**'
      - '.github/workflows/ci-frontend.yml'

# PR への連続 push は古い実行をキャンセルする。main への push はキャンセルしない。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint / typecheck / build / knip / size-limit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6
        with:
          # push しないので GITHUB_TOKEN を作業ツリーに残さない。
          persist-credentials: false

      # pnpm は packageManager の版で入れ、setup-node の cache: 'pnpm' より前に置く（無いとキャッシュ復元が失敗する）。
      # package_json_file はこの action に defaults.run.working-directory が効かないため明示する。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # test ファイルは tsconfig.exclude で除外済み。
      - name: TypeScript type-check
        run: pnpm exec tsc --noEmit

      - name: ESLint (max-warnings=0)
        run: pnpm exec eslint . --max-warnings=0

      # ビルドが通るかだけ確認する。VITE_* はダミーで良い（コード量は本番と同じ）。
      - name: Build (verify only)
        env:
          VITE_API_BASE_URL: https://example.invalid
          VITE_OIDC_AUTHORIZE_URI: https://example.invalid/oauth/v2/authorize
          VITE_OIDC_TOKEN_URI: https://example.invalid/oauth/v2/token
          VITE_OIDC_CLIENT_ID: ci-dummy
          VITE_OIDC_REDIRECT_URI: https://example.invalid/login/callback
          VITE_OIDC_SCOPE: openid profile email offline_access
        run: pnpm run build

      # 本番バンドル（gzip）を計測して Job Summary に出す。上限は .size-limit.json。
      # continue-on-error はこの step だけ（install / build の失敗は job を赤くする）。
      - name: Run size-limit (report only)
        continue-on-error: true
        run: |
          set +e
          pnpm exec size-limit > /tmp/size-report.txt 2>&1
          status=$?
          {
            echo "## Frontend bundle size (size-limit, gzip)"
            echo ""
            echo '```'
            cat /tmp/size-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # 認可の設定が無くてもビルドできること（発行者が無いあいだもフロントを出せること）を確かめる。
      - name: 認可の設定が無くてもビルドできる
        env:
          VITE_API_BASE_URL: https://example.invalid
        run: pnpm run build

      # CD の門番（.github/scripts/check-auth-config.sh）が正例・負例とも正しく判定するかを確かめる。
      - name: 門番が正しく通し・正しく止めることを確かめる
        run: "${{ github.workspace }}/.github/scripts/test-check-auth-config.sh"

      # 未使用ファイル / 未使用依存 / 未宣言依存を検出して Job Summary に出す（設定: frontend/knip.json）。
      # continue-on-error はこの step だけ。knip の exit code は Summary 出力後もそのまま返す。
      - name: Run knip (report only)
        continue-on-error: true
        run: |
          set +e
          pnpm exec knip --reporter markdown > /tmp/knip-report.md 2>&1
          status=$?
          {
            echo "## Frontend dead code (knip)"
            echo ""
            cat /tmp/knip-report.md
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Vitest 単体テスト（jsdom）。カバレッジ閾値は vitest.config.js の thresholds がそのまま効く。
  vitest-unit:
    name: Vitest unit + coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest (coverage gate)
        run: |
          set -o pipefail
          pnpm exec vitest run --coverage --coverage.reporter=text-summary | tee /tmp/vitest-out.txt
          {
            echo "## Frontend test coverage"
            echo '```'
            grep -A6 "Coverage report" /tmp/vitest-out.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Storybook の story を headless Chromium で実行する（vitest.config.js の projects.storybook）。カバレッジは測らない。
  vitest-storybook:
    name: Vitest storybook
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chromium 本体をキャッシュする（lockfile が変わらなければ playwright の版も変わらない）。
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install Playwright Chromium (Storybook tests)
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Storybook tests (browser)
        env:
          WITH_STORYBOOK_TESTS: '1'
        run: pnpm exec vitest run --project=storybook

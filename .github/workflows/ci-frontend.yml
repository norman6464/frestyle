name: CI - Frontend (Vite + Vitest)

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/scripts/**'
      - '.github/workflows/ci-frontend.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/scripts/**'
      - '.github/workflows/ci-frontend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint / typecheck / build / knip / size-limit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type-check
        run: pnpm exec tsc --noEmit

      - name: ESLint (max-warnings=0)
        run: pnpm exec eslint . --max-warnings=0

      - name: Build (verify only)
        env:
          VITE_API_BASE_URL: https://example.invalid
          VITE_OIDC_AUTHORIZE_URI: https://example.invalid/oauth/v2/authorize
          VITE_OIDC_TOKEN_URI: https://example.invalid/oauth/v2/token
          VITE_OIDC_CLIENT_ID: ci-dummy
          VITE_OIDC_REDIRECT_URI: https://example.invalid/login/callback
          VITE_OIDC_SCOPE: openid profile email offline_access
        run: pnpm run build

      - name: Run size-limit (report only)
        continue-on-error: true
        run: |
          set +e
          pnpm exec size-limit > /tmp/size-report.txt 2>&1
          status=$?
          {
            echo "## Frontend bundle size (size-limit, gzip)"
            echo ""
            echo '```'
            cat /tmp/size-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: 認可の設定が無くてもビルドできる
        env:
          VITE_API_BASE_URL: https://example.invalid
        run: pnpm run build

      - name: 門番が正しく通し・正しく止めることを確かめる
        run: "${{ github.workspace }}/.github/scripts/test-check-auth-config.sh"

      - name: Run knip (report only)
        continue-on-error: true
        run: |
          set +e
          pnpm exec knip --reporter markdown > /tmp/knip-report.md 2>&1
          status=$?
          {
            echo "## Frontend dead code (knip)"
            echo ""
            cat /tmp/knip-report.md
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  vitest-unit:
    name: Vitest unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest
        run: pnpm exec vitest run

  vitest-storybook:
    name: Vitest storybook
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install Playwright Chromium (Storybook tests)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Storybook tests (browser)
        env:
          WITH_STORYBOOK_TESTS: '1'
        run: pnpm exec vitest run --project=storybook

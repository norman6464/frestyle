name: CI - Frontend (Vite + Vitest)

# 目的: PR / push のたびにフロントエンドのテストとビルド検証だけを行う。
# 本ワークフローはデプロイ先を一切触らない。デプロイは cd-frontend.yml で別途。

# frontend/ に触れない PR・push では走らせない（Actions の課金分数の節約）。
# 対象は frontend/ 配下とこのファイル自身。ルートの firebase.json はデプロイ設定で
# ビルド・テストには影響しないため含めない。
#
# 将来「必須ステータスチェック」にする場合は注意: paths で発火しなかったワークフローの
# チェックは pending のまま残り PR がマージできなくなる。その時はここを外し、変更検知
# ジョブ + 各ジョブの if: で飛ばす方式（判定ジョブ分 +1 分/イベント）へ切り替える。
on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'

# PR に続けて push したとき、古い実行を止めて分数を節約する。main への push は止めない
# （マージ後の main を最後まで検証する）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # 型チェック・lint・ビルド検証。shard に分けても速くならない固定コストの検査群
  # なので 1 ジョブのままにする（Vitest の各 shard と同居させると、shard の数だけ
  # 重複して払うコストになるため、ここだけ切り出している）。
  lint-and-build:
    name: Lint / typecheck / build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      # pnpm は packageManager フィールドの版で入れる（端末・CI・Docker で同じ解決にする）。
      # setup-node のキャッシュ復元より前に置くこと（pnpm が無いと cache: 'pnpm' が失敗する）。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # この action は run ステップではないので defaults.run.working-directory が
          # 効かない。リポジトリ直下に package.json は無いので、版を読む先を明示する。
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # TypeScript 型チェック (production code 限定 / test ファイルは tsconfig.exclude で除外済み)。
      # tsc が 1 エラーでも報告したら fail する。React / TypeScript Handbook の
      # "static type-checking before runtime" を CI で強制する。
      - name: TypeScript type-check
        run: pnpm exec tsc --noEmit

      # ESLint で 1 件でも warning があれば fail させる（将来のドリフト防止）。
      # rules は eslint.config.js で管理。
      - name: ESLint (max-warnings=0)
        run: pnpm exec eslint . --max-warnings=0

      - name: Build (verify only)
        # ビルドが通るかだけ確認。Firebase Hosting へのデプロイは CD 側で実施。
        env:
          # ビルド時の VITE_* は本番値ではなくダミーで OK（型チェック・syntax確認が目的）
          VITE_API_BASE_URL: https://example.invalid
          VITE_OIDC_AUTHORIZE_URI: https://example.invalid/oauth/v2/authorize
          VITE_OIDC_TOKEN_URI: https://example.invalid/oauth/v2/token
          VITE_OIDC_CLIENT_ID: ci-dummy
          VITE_OIDC_REDIRECT_URI: https://example.invalid/login/callback
          VITE_OIDC_SCOPE: openid profile email offline_access
        run: pnpm run build

      # **認可の設定が無くてもビルドが通ること**を毎回確かめる。
      # ここが通らなくなったら、発行者が無いあいだフロントを出せない状態に戻っている。
      - name: 認可の設定が無くてもビルドできる
        env:
          VITE_API_BASE_URL: https://example.invalid
        run: pnpm run build

      # CD の門番（.github/scripts/check-auth-config.sh）が、宣言と実態の
      # 食い違いを本当に捕まえるかを毎回試す。
      #
      # シェルの分岐は、書いた時に 1 度手で試して終わりになりやすい。
      # **通ることだけでなく、落ちるべきものが落ちること**まで見る。
      - name: 門番が正しく通し・正しく止めることを確かめる
        run: "${{ github.workspace }}/.github/scripts/test-check-auth-config.sh"

  # Vitest 単体テスト(jsdom)。3 shard に分割する。
  #
  # カバレッジの閾値ゲート(vitest.config.js の thresholds)は「全 shard を合算した後」
  # にしか正しく判定できない。shard 単体では他の shard が担当するファイルが軒並み
  # 未実行(0%)に見えるため、shard ごとに thresholds を判定すると必ず割れる。
  # そこで shard 側では --coverage.thresholds.* を 0 で上書きして無効化し(実際の
  # テスト失敗はこれとは独立に検出される)、閾値判定そのものは後続の vitest-coverage
  # ジョブが blob report(--reporter=blob)をマージしてから 1 回だけ行う。
  vitest-unit:
    name: Vitest unit (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest (shard ${{ matrix.shard }}/3)
        run: |
          pnpm exec vitest run --shard=${{ matrix.shard }}/3 --reporter=blob --coverage \
            --coverage.thresholds.lines=0 --coverage.thresholds.functions=0 \
            --coverage.thresholds.branches=0 --coverage.thresholds.statements=0

      # blob report を vitest-coverage ジョブへ渡す（ジョブごとに runner が別なので
      # artifact 経由でしかやり取りできない。shard ごとにファイル名が自動的に
      # 分かれる: .vitest-reports/blob-<shard>-3.json）。
      #
      # include-hidden-files が既定 false のままだと、ドット始まりの .vitest-reports/
      # 配下がアップロード対象の glob から丸ごと除外され、「blob report は書き出されて
      # いるのに artifact には 0 ファイル」という気づきにくい失敗になる(実際に踏んだ)。
      - name: Upload blob report
        uses: actions/upload-artifact@v7
        with:
          name: vitest-blob-unit-${{ matrix.shard }}
          path: frontend/.vitest-reports/
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

  # Storybook の story をブラウザ(headless Chromium)で実行する。2 shard に分割する。
  # カバレッジは測らない(story のレンダリング分が unit の分母に混ざるとゲートが
  # 緩む方向に変質するため、従来どおり unit 側だけで閾値ゲートする)。カバレッジを
  # 測らない以上、shard 間で合算しなければならない数値も無いので、vitest-unit と違って
  # merge ジョブは要らない(matrix の全 shard が成功して初めてこのジョブ全体が
  # 成功扱いになる、という GitHub Actions 標準の挙動だけで十分)。
  vitest-storybook:
    name: Vitest storybook (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Storybook の story はブラウザモードの Vitest プロジェクト（projects.storybook）で
      # そのままテストとして走る。headless Chromium が要るのでここで入れる。
      - name: Install Playwright Chromium (Storybook tests)
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Storybook tests (browser, shard ${{ matrix.shard }}/2)
        env:
          WITH_STORYBOOK_TESTS: '1'
        run: pnpm exec vitest run --project=storybook --shard=${{ matrix.shard }}/2

  # vitest-unit の 3 shard 分の blob report をマージし、カバレッジ閾値ゲートを
  # 1 回だけ行う。この repo の必須チェックはここが担う。
  vitest-coverage:
    name: Vitest coverage gate (merged)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [vitest-unit]
    # needs が失敗すると既定ではこのジョブは skip になる。skip は branch protection 上
    # 「成功」と同じ扱いなので、落ちているはずの PR がマージ可能に見えてしまう。
    # always() で必ず起動し、前段の結果は下の step で自分で確かめて落とす
    # (backend の coverage ジョブと同じ考え方)。
    if: always()
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: 前段ジョブの結果を確認
        if: needs.vitest-unit.result != 'success'
        run: |
          echo "::error::vitest-unit が成功していないためカバレッジを合算できません (result=${{ needs.vitest-unit.result }})"
          exit 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 3 shard 分の blob report をまとめて取り出す。ファイル名は
      # blob-<shard>-3.json で shard ごとに自動的に分かれているため、
      # merge-multiple で同じディレクトリへ集めても衝突しない。
      - name: Download blob reports (3 shards)
        uses: actions/download-artifact@v7
        with:
          pattern: vitest-blob-unit-*
          # path はジョブの working-directory ではなくワークスペース起点で解決される。
          path: frontend/.vitest-reports
          merge-multiple: true

      # --mergeReports は実テストを再実行せず、blob report から結果とカバレッジを
      # 再構成するだけ。ここで初めて vitest.config.js 本来の thresholds
      # (shard 側で上書きしていない、正真正銘の閾値)が効く。
      - name: Merge blob reports + coverage gate
        run: |
          set -o pipefail
          pnpm exec vitest run --mergeReports --coverage --coverage.reporter=text-summary | tee /tmp/vitest-out.txt
          {
            echo "## Frontend test coverage (3 shard 合算)"
            echo '```'
            grep -A6 "Coverage report" /tmp/vitest-out.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # 未使用ファイル / 未使用依存 / 未宣言(phantom)依存を knip で検出する。
  # 必須チェック(Lint/typecheck/build・Vitest 系)とは独立した job にし、デッドコードの可視化に徹する。
  # 件数を使った gating はしない(数値が安定してから別途)。
  # knip 設定は frontend/knip.json(rules で files/dependencies/unlisted に集中、
  # FSD の Public API barrel の未使用 export ノイズは当面 off)。
  # 非ブロッキング化は「knip 実行 step だけ」continue-on-error にする(下記)。
  # checkout / pnpm install --frozen-lockfile の失敗は job を赤くして可視化する(握り潰さない)。本 job は
  # 必須チェックではないため、赤くなっても PR マージはブロックしない。
  knip:
    name: Dead code (knip)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          # この job は push しないため、GITHUB_TOKEN を作業ツリーに残さない
          # (後続で PR コードの pnpm install --frozen-lockfile / pnpm exec knip を走らせるため)。
          persist-credentials: false

      # pnpm は packageManager フィールドの版で入れる（端末・CI・Docker で同じ解決にする）。
      # setup-node のキャッシュ復元より前に置くこと（pnpm が無いと cache: 'pnpm' が失敗する）。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # この action は run ステップではないので defaults.run.working-directory が
          # 効かない。リポジトリ直下に package.json は無いので、版を読む先を明示する。
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 検出結果を PR の Job Summary に markdown で残す。knip の exit code は
      # 「dead code 検出 = 非 0」になり得るが、それを握り潰さず保持する
      # (設定エラー・起動失敗も Summary に出力してから同じ code で終了)。
      # continue-on-error はこの step だけに付け、非 0 でも job を止めない
      # (checkout / pnpm install --frozen-lockfile の失敗は job を赤くして可視化する)。
      - name: Run knip (report only)
        continue-on-error: true
        run: |
          set +e
          pnpm exec knip --reporter markdown > /tmp/knip-report.md 2>&1
          status=$?
          {
            echo "## Frontend dead code (knip)"
            echo ""
            cat /tmp/knip-report.md
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # 本番バンドルサイズ(gzip)を size-limit で計測する。必須チェック(Lint/typecheck/build・Vitest 系)とは
  # 独立した job にし、サイズの可視化と回帰検知に徹する。上限(.size-limit.json)は現状 +
  # ヘッドルームで、超過はシグナルとして扱う。厳密な gating は数値が安定してから別途。
  # 非ブロッキング化は「size-limit 実行 step だけ」continue-on-error にする(下記)。
  # pnpm install --frozen-lockfile / build の失敗は job を赤くして可視化する(握り潰さない)。本 job は必須チェック
  # ではないため、赤くなっても PR マージはブロックしない。
  size-limit:
    name: Bundle size (size-limit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          # この job は push しないため GITHUB_TOKEN を作業ツリーに残さない。
          persist-credentials: false

      # pnpm は packageManager フィールドの版で入れる（端末・CI・Docker で同じ解決にする）。
      # setup-node のキャッシュ復元より前に置くこと（pnpm が無いと cache: 'pnpm' が失敗する）。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # この action は run ステップではないので defaults.run.working-directory が
          # 効かない。リポジトリ直下に package.json は無いので、版を読む先を明示する。
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # size-limit は dist/assets/* の実出力を計測するため、先に本番ビルドする。
      # VITE_* はサイズ計測が目的なのでダミーで良い(コード量は本番と同じ)。
      - name: Build
        env:
          VITE_API_BASE_URL: https://example.invalid
          VITE_OIDC_AUTHORIZE_URI: https://example.invalid/oauth/v2/authorize
          VITE_OIDC_TOKEN_URI: https://example.invalid/oauth/v2/token
          VITE_OIDC_CLIENT_ID: ci-dummy
          VITE_OIDC_REDIRECT_URI: https://example.invalid/login/callback
          VITE_OIDC_SCOPE: openid profile email offline_access
        run: pnpm run build

      # 計測結果を Job Summary に残す。上限超過で size-limit は非 0 を返すが、
      # continue-on-error はこの step だけに付け、非 0 でも job を止めない
      # (build / pnpm install --frozen-lockfile の失敗はこの step の前段で job を赤くする)。
      - name: Run size-limit (report only)
        continue-on-error: true
        run: |
          set +e
          pnpm exec size-limit > /tmp/size-report.txt 2>&1
          status=$?
          {
            echo "## Frontend bundle size (size-limit, gzip)"
            echo ""
            echo '```'
            cat /tmp/size-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

name: E2E - Playwright Smoke

on:
  workflow_run:
    workflows:
      - 'CD - Frontend Deploy to Firebase Hosting'
      - 'CD - Backend Deploy to Cloud Run'
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'PLAYWRIGHT_BASE_URL（既定 https://frestyle.dev）'
        required: false
        default: 'https://frestyle.dev'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_run' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  smoke:
    name: Playwright Smoke (Chromium)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright smoke
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url || 'https://frestyle.dev' }}
        run: pnpm exec playwright test --project=chromium

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload trace / screenshots / video on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7

  local-mocked:
    name: Playwright Local (mocked API)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Build (same-origin / API モック前提)
        env:
          VITE_API_BASE_URL: ''
          VITE_OIDC_AUTHORIZE_URI: https://example.invalid/oauth/v2/authorize
          VITE_OIDC_TOKEN_URI: https://example.invalid/oauth/v2/token
          VITE_OIDC_CLIENT_ID: ci-dummy
          VITE_OIDC_REDIRECT_URI: https://example.invalid/login/callback
          VITE_OIDC_SCOPE: openid profile email offline_access
        run: pnpm run build

      - name: Run local mocked E2E
        run: pnpm run e2e:local

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-local
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload trace / screenshots / video on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-local
          path: frontend/test-results/
          retention-days: 7

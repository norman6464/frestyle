name: E2E - Playwright Smoke

# 目的: Playwright + Chromium による E2E を 2 種類実行する。
#   smoke        : 本番 (https://frestyle.dev) に対する認証前スモーク（外形監視）
#   local-mocked : ローカルビルド + API モックによる認証付き導線・主要画面の検証
# 失敗時は html report / trace / screenshot / video を artifact に残す。
#
# トリガー:
#   - workflow_run（cd-frontend / cd-backend の完了後）: smoke のみ。
#     本番を叩く検証は「本番が変わった直後」にだけ意味がある。以前は PR / main push でも
#     走らせていたが、デプロイは手動なので PR や main push の時点で本番は変わっておらず、
#     PR の検証にならないうえ、本番側の障害で無関係な PR が赤くなっていた。
#   - PR / main push (frontend / 本ファイルへの変更): local-mocked のみ
#   - workflow_dispatch（任意のタイミングで実行）: smoke のみ
#
# CodeBuild ではなく Actions に統一する判断:
#   - API は public ALB 経由でアクセス可能で VPC 内疎通は不要
#   - OIDC AssumeRole は今回 不要（外形監視）
#   - 既存 cd-* / scheduled-* と同 platform に集約してログ・通知を一元管理

on:
  workflow_run:
    workflows:
      - 'CD - Frontend Deploy to Firebase Hosting'
      - 'CD - Backend Deploy to Cloud Run'
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'PLAYWRIGHT_BASE_URL（既定 https://frestyle.dev）'
        required: false
        default: 'https://frestyle.dev'

# PR に続けて push したとき、古い実行を止めて分数を節約する。main への push は止めない。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  smoke:
    name: Playwright Smoke (Chromium)
    # デプロイが成功した直後と手動実行のときだけ。workflow_run は CD が失敗・キャンセル
    # されても発火するため、conclusion を見て成功時に限る。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      # pnpm は packageManager フィールドの版で入れる（端末・CI・Docker で同じ解決にする）。
      # setup-node のキャッシュ復元より前に置くこと（pnpm が無いと cache: 'pnpm' が失敗する）。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # この action は run ステップではないので defaults.run.working-directory が
          # 効かない。リポジトリ直下に package.json は無いので、版を読む先を明示する。
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright smoke
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url || 'https://frestyle.dev' }}
        run: pnpm exec playwright test --project=chromium

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload trace / screenshots / video on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7

  # ローカルビルド + API モックによる「認証付き導線・主要画面」E2E。
  # 本番の発行者 / DB に触れず、/api/v2/** を Playwright route でモックして検証する。
  local-mocked:
    name: Playwright Local (mocked API)
    # PR と main push のときだけ（本番のデプロイ後・手動実行では走らせない）。
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      # pnpm は packageManager フィールドの版で入れる（端末・CI・Docker で同じ解決にする）。
      # setup-node のキャッシュ復元より前に置くこと（pnpm が無いと cache: 'pnpm' が失敗する）。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # この action は run ステップではないので defaults.run.working-directory が
          # 効かない。リポジトリ直下に package.json は無いので、版を読む先を明示する。
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # VITE_API_BASE_URL='' で同一オリジン相対 (/api/v2/*) にする。これにより index.html の
      # CSP connect-src 'self' に収まり、Playwright route がモックを差し込める（cross-origin の
      # ダミーホストは CSP でブロックされ route に到達しないため）。
      - name: Build (same-origin / API モック前提)
        env:
          VITE_API_BASE_URL: ''
          VITE_OIDC_AUTHORIZE_URI: https://example.invalid/oauth/v2/authorize
          VITE_OIDC_TOKEN_URI: https://example.invalid/oauth/v2/token
          VITE_OIDC_CLIENT_ID: ci-dummy
          VITE_OIDC_REDIRECT_URI: https://example.invalid/login/callback
          VITE_OIDC_SCOPE: openid profile email offline_access
        run: pnpm run build

      - name: Run local mocked E2E
        run: pnpm run e2e:local

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-local
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload trace / screenshots / video on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-local
          path: frontend/test-results/
          retention-days: 7

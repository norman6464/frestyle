name: CI - Backend (Go)

# 目的: backend/ の整形・lint・単体テスト（race + coverage）・生成物の drift 検査・ビルドと、
# 実 PostgreSQL に対する結合テストを行い、単体 + 結合の合算カバレッジが floor を下回ったら落とす。
# backend/** とこのファイル自身の変更でだけ発火する。
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend-go.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend-go.yml'

# PR への連続 push は古い実行をキャンセルする。main への push はキャンセルしない。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: lint / test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      # Makefile が go install / curl で入れるツール（sqlc / gofumpt / atlas）のバイナリ。
      # 版は Makefile に書いてあるので、Makefile が変わればキャッシュも作り直される。
      - name: Cache Go tool binaries
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: go-bin-${{ runner.os }}-${{ hashFiles('backend/Makefile') }}

      - name: go mod download
        run: go mod download

      - name: go mod tidy check
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "::error::go.mod/go.sum is not tidy. Run 'go mod tidy' in backend/ and commit."
            git diff go.mod go.sum
            exit 1
          fi

      # 未整形があれば失敗。ローカルは `make fmt`（gofumpt -w）で直す。
      - name: gofumpt check
        run: |
          make ensure-gofumpt
          unformatted=$("$(go env GOPATH)/bin/gofumpt" -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofumpt-formatted:"
            echo "$unformatted"
            echo "Run 'make fmt' (gofumpt -w) in backend/ locally and commit the result."
            exit 1
          fi

      # govet / staticcheck / errcheck 等の既定 linter に加え、backend/.golangci.yml で有効化した linter を実行する。
      # build tag は backend/.golangci.yml の run.build-tags で指定する（ここに args で足すとローカルと CI の対象集合がずれる）。
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: backend

      # 実際に呼ぶコードパスに該当する既知 CVE だけを報告する。stdlib の CVE が頻出するため非ブロッキング。
      - name: govulncheck (advisory)
        continue-on-error: true
        run: |
          set -o pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./... | tee /tmp/govuln.txt
          {
            echo "## govulncheck (advisory)"
            echo '```'
            tail -5 /tmp/govuln.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 単体テスト分のカバレッジ。結合分との合算と floor 判定は coverage ジョブが行う。
      - name: go test (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage-unit.out ./...

      - name: Upload unit coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          # path はジョブの working-directory ではなくワークスペース起点で解決される。
          path: backend/coverage-unit.out
          if-no-files-found: error
          retention-days: 7

      # schema.hcl から生成する schema.gen.sql / 02-schema.sql が最新か検証する（make schema-gen 忘れの検知）。
      # Atlas は runner の docker で使い捨て PostgreSQL を自分で立てる。dev-url は pg_trgm 入りの自前イメージ
      # （backend/scripts/atlas-dev/Dockerfile）。schema.hcl の gin_trgm_ops 索引が素の postgres では inspect に失敗するため。
      - name: schema drift check (schema.hcl -> schema.gen.sql)
        run: |
          make schema-gen
          if [ -n "$(git status --porcelain -- internal/infra/database/schema/schema.gen.sql scripts/local-db-init/02-schema.sql)" ]; then
            echo "::error::schema.gen.sql is out of date. Run 'make schema-gen' in backend/ and commit the result."
            git status --porcelain -- internal/infra/database/schema/schema.gen.sql scripts/local-db-init/02-schema.sql
            git diff -- internal/infra/database/schema/schema.gen.sql scripts/local-db-init/02-schema.sql
            exit 1
          fi

      # sqlc 生成物（internal/adapter/persistence/sqlcgen/）がスキーマ・クエリと一致しているか検証する。
      - name: sqlc drift check
        run: |
          make sqlc
          # 未追跡の新規生成ファイルも検知するため porcelain で判定する。
          if [ -n "$(git status --porcelain -- internal/adapter/persistence/sqlcgen/)" ]; then
            echo "::error::sqlc generated code is out of date. Run 'make sqlc' in backend/ and commit internal/adapter/persistence/sqlcgen/."
            git status --porcelain -- internal/adapter/persistence/sqlcgen/
            git diff -- internal/adapter/persistence/sqlcgen/
            exit 1
          fi

      # sqlc.yaml の rules で WHERE の無い UPDATE / DELETE 等の危険な SQL を弾く（実 DB は不要）。
      - name: sqlc vet (dangerous SQL)
        run: make sqlc-vet

      - name: go build
        run: go build ./...

  # 本物の PostgreSQL を docker compose で起動し、-tags=integration のテストだけを回す。
  integration:
    name: integration tests (postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go mod download
        run: go mod download

      # Docker Hub の pull は transient に timeout することがあるためリトライする。
      - name: Start PostgreSQL (docker compose)
        run: |
          for i in 1 2 3; do
            docker compose -f docker-compose.integration.yml pull --quiet && break
            echo "image pull failed (attempt $i/3), retrying in 10s..."
            sleep 10
          done
          docker compose -f docker-compose.integration.yml up -d --wait

      # -run Integration で結合テストだけ回す（TEST_DATABASE_URL を持つこのジョブで単体を再実行すると
      # env 依存の単体テストが誤検知し得る）。-covermode=atomic は test ジョブと揃える（mode が違うプロファイルは連結できない）。
      # -race は付けない（競合検査は test ジョブが担う）。
      - name: Run integration tests (-tags=integration)
        env:
          TEST_DATABASE_URL: postgres://frestyle:frestyle@localhost:5433/frestyle_integration?sslmode=disable
        run: go test -tags=integration -run Integration -covermode=atomic -coverprofile=coverage-integration.out ./...

      - name: Upload integration coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: coverage-integration
          # path はジョブの working-directory ではなくワークスペース起点で解決される。
          path: backend/coverage-integration.out
          if-no-files-found: error
          retention-days: 7

      - name: Stop PostgreSQL
        if: always()
        run: docker compose -f docker-compose.integration.yml down -v

  # 単体（test）と結合（integration）のカバレッジを合算し、floor 判定を 1 回だけ行う。
  # persistence のクエリは結合側でしか通らないので、単体だけでは実態より低く出る。
  coverage:
    name: coverage floor (unit + integration)
    runs-on: ubuntu-latest
    needs: [test, integration]
    # needs が失敗すると既定ではこのジョブは skip になり、skip は branch protection 上「成功」扱いになる。
    # always() で必ず起動し、前段の結果は下の step で自分で確かめて落とす。
    if: always()
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: 前段ジョブの結果を確認
        if: needs.test.result != 'success' || needs.integration.result != 'success'
        run: |
          echo "::error::前段ジョブが成功していないためカバレッジを合算できません (test=${{ needs.test.result }}, integration=${{ needs.integration.result }})"
          exit 1

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      # go tool cover -func はソースをモジュール経由で読むため、先に依存を揃える。
      - name: go mod download
        run: go mod download

      - name: Download unit coverage profile
        uses: actions/download-artifact@v7
        with:
          name: coverage-unit
          path: backend

      - name: Download integration coverage profile
        uses: actions/download-artifact@v7
        with:
          name: coverage-integration
          path: backend

      # coverprofile は 1 行目が mode 行、以降が <file>:<range> <stmts> <count>。mode 行を 1 本残して残りを連結すれば
      # go tool cover が同一ブロックの count を足し合わせる（外部ツール不要。条件は mode が揃っていること）。
      # COVERAGE_MIN は 0% のパッケージ（domain の定数群 / cmd / 薄い infra）も分母に含む総計の下限。
      - name: merge profiles + coverage gate
        env:
          COVERAGE_MIN: '66'
        run: |
          for f in coverage-unit.out coverage-integration.out; do
            if ! head -1 "$f" | grep -qx 'mode: atomic'; then
              echo "::error::${f} の 1 行目が 'mode: atomic' ではありません（各ジョブの -covermode=atomic を確認してください）: $(head -1 "$f")"
              exit 1
            fi
          done

          {
            echo 'mode: atomic'
            grep -h -v '^mode:' coverage-unit.out coverage-integration.out
          } > coverage-merged.out

          unit=$(go tool cover -func=coverage-unit.out | tail -1 | awk '{print $3}')
          integration=$(go tool cover -func=coverage-integration.out | tail -1 | awk '{print $3}')
          total=$(go tool cover -func=coverage-merged.out | tail -1 | awk '{print $3}')

          {
            echo "## Backend test coverage: ${total} (min ${COVERAGE_MIN}%)"
            echo ""
            echo "| 計測 | カバレッジ |"
            echo "| --- | --- |"
            echo "| 単体のみ (race) | ${unit} |"
            echo "| 結合のみ (postgres) | ${integration} |"
            echo "| **合算（判定対象）** | **${total}** |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "unit: ${unit} / integration: ${integration} / merged: ${total} (min ${COVERAGE_MIN}%)"

          num=${total%\%}
          if awk -v t="$num" -v m="$COVERAGE_MIN" 'BEGIN { exit !(t+0 < m+0) }'; then
            echo "::error::backend coverage ${total} is below floor ${COVERAGE_MIN}%"
            exit 1
          fi

name: Mutation Testing (non-blocking)

# 目的: 実装を機械的に書き換えてテストが検出するかを測る（gremlins / Go）。閾値ゲートは無し。
#   - PR: `mutation` ラベル付きの PR だけ、変更差分を light 実行。ジョブ単位で continue-on-error
#   - 週次 / 手動: モジュール全体を実行し、レポートを artifact 保存
on:
  pull_request:
    branches: [main]
    # labeled: ラベル付与時、synchronize: ラベル付き PR への push 時。ラベル無しはジョブが skip されるだけ。
    types: [labeled, synchronize]
  schedule:
    - cron: '0 16 * * 0' # 日曜 01:00 JST
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-mutation:
    name: Gremlins (Go mutation)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'mutation')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          # --diff の比較基準（origin/<base>）を得るため全履歴を取得する。
          fetch-depth: 0
          # このジョブ内の git fetch に資格情報が要る（permissions は contents: read なので書き込みには使えない）。
          persist-credentials: true

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0

      # 信頼できない base_ref は env 経由で渡す。
      - name: Gremlins (PR light — diff)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          "$(go env GOPATH)/bin/gremlins" unleash --diff "origin/$BASE_REF" -o /tmp/gremlins.json

      - name: Gremlins (full)
        if: github.event_name != 'pull_request'
        run: '"$(go env GOPATH)/bin/gremlins" unleash ./... -o /tmp/gremlins-full.json'

      - name: Upload gremlins report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gremlins-report
          path: /tmp/gremlins*.json
          # レポートが無い = 実行できなかった事実をログに残す。
          if-no-files-found: warn

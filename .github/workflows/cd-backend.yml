name: CD - Backend Deploy to Cloud Run

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '本番デプロイ確認用に "deploy" と入力してください'
        required: true
        type: string

env:
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/654858357747/locations/global/workloadIdentityPools/github/providers/github-actions
  GCP_SERVICE_ACCOUNT: frestyle-prod-github-deploy@frestyle-prod.iam.gserviceaccount.com
  GCP_PROJECT_ID: frestyle-prod
  GCP_REGION: asia-northeast1
  IMAGE_REPO: asia-northeast1-docker.pkg.dev/frestyle-prod/frestyle-prod-backend/fre-style
  CLOUD_RUN_SERVICE: frestyle-prod-backend

permissions:
  contents: read

concurrency:
  group: cd-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Confirm input
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation input
        run: |
          if [ "${{ inputs.confirm }}" != "deploy" ]; then
            echo "ERROR: confirm に 'deploy' と入力されていません。中止します。"
            exit 1
          fi

  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [guard]
    permissions:
      id-token: write
      contents: read

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Set image metadata
        id: meta
        run: |
          echo "image_tag=${{ env.IMAGE_REPO }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push production image (Go backend)
        working-directory: backend
        run: |
          docker buildx build --platform linux/amd64 \
            -t ${{ env.IMAGE_REPO }}:latest \
            -t ${{ steps.meta.outputs.image_tag }} \
            --push .

  deploy:
    name: Cloud Run Deploy
    runs-on: ubuntu-latest
    needs: [build-and-push]
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    environment: production

    steps:
      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy new revision to Cloud Run
        run: |
          gcloud run services update "${{ env.CLOUD_RUN_SERVICE }}" \
            --platform managed \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --region "${{ env.GCP_REGION }}" \
            --image "${{ needs.build-and-push.outputs.image_tag }}" \
            --quiet

      - name: Verify health (Cloud Run direct URL)
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS "https://frestyle-prod-backend-kb5pw7fpka-an.a.run.app/api/v2/health"; then
              echo "✅ Healthy"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "❌ Health check failed after 5 attempts"
          exit 1

      - name: Verify health (custom domain, best-effort)
        continue-on-error: true
        run: |
          if curl -fsS "https://api.frestyle.dev/api/v2/health"; then
            echo "✅ api.frestyle.dev も到達可能"
          else
            echo "::warning::api.frestyle.dev への到達確認に失敗しました（Google 管理証明書が未発行の可能性）。frestyle-prod-backend-kb5pw7fpka-an.a.run.app の確認結果を正とします。"
          fi
